name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public HTTPS URL where BallvsBall is deployed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build BallvsBall APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ["APP_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("app_url must be a valid public HTTPS URL.")
          if any(c in url for c in ["\n", "\r", "'", '"']):
              raise SystemExit("app_url contains unsupported characters.")
          print("Using deployment host:", parsed.netloc)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle --no-daemon --stacktrace -PappUrl="$APP_URL" -p android-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BallvsBall-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
